<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig config so sharp's bundled librsvg/pango can find our
  bundled watermark fonts regardless of what (if anything) is installed on
  the host OS. Railway's minimal container has no system fonts, which
  caused watermark text to render as empty boxes in production — see
  backend/assets/fonts/LICENSE.txt and git history around 2026-09-21.

  Pointed to via FONTCONFIG_FILE env var, set in src/lib/watermark.js
  before any SVG rendering happens.
-->
<fontconfig>
  <!-- <dir> is templated at startup by src/lib/fonts.js into a generated
       copy under /tmp, since the absolute path isn't known until runtime. -->
  <dir>__FONTS_DIR__</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
